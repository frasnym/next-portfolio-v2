services:
  development:
    container_name: portfolio_dev
    image: portfolio_dev
    restart: "no"
    build:
      context: .
      target: deps
    command: ["npm", "run", "dev"]
    volumes:
      - type: bind
        source: .
        target: /app
      - /app/node_modules
    working_dir: /app
    ports:
      - "3000:3000"
